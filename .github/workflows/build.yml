# 澈知科技校园网连接 — Windows 构建 + 离线自检 + 安全扫描
# 仅执行离线构建与自检：CI 环境不配置真实校园网账号，不执行真实认证，
# 核心侧 --ephemeral-check / --ephemeral-probe 均为官方离线测试钩子（见
# 认证核心源码/docs/EphemeralExperimental.md 与 DialerAuth.c 的 probe 分支）。
name: build

on:
  push:
    branches: [main, 'fix/**']
  pull_request:
  workflow_dispatch:

# Build/test jobs do not need repository write permissions.
permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Licensed candidate x64 source compilation
        shell: pwsh
        run: ./scripts/Test-LicensedCandidateCompile.ps1

      - name: Cache curl source package
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: third-party
          key: curl-8.23.0-E3DE77CFA6367083C776A26647FC9F633B538C06C3BAA73D931A252AC8F72B49

      - name: Fetch and verify dependencies
        shell: pwsh
        run: ./scripts/Fetch-Curl.ps1

      - name: Set up MinGW-w64 (UCRT64)
        id: msys2
        uses: msys2/setup-msys2@3c51bf698df1e37b2261f53cb67797b97761185c # v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-ninja

      - name: Resolve MSYS2 toolchain root
        # setup-msys2 的安装位置随 runner 环境变化（实测 hostedtoolcache 提取后不在
        # C:\msys64）：优先 action 输出，其次探测常见候选，找不到即失败。
        shell: pwsh
        run: |
          $candidates = @(
            '${{ steps.msys2.outputs.msys2-location }}',
            'C:\msys64',
            "$env:RUNNER_TEMP\msys64",
            'D:\a\_msys64'
          ) | Where-Object { $_ -and (Test-Path (Join-Path $_ 'ucrt64\bin\gcc.exe')) }
          if (-not $candidates) {
            $found = Get-ChildItem -Path C:\,D:\ -Filter gcc.exe -Recurse -Depth 5 -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match 'ucrt64\\bin\\gcc\.exe$' } | Select-Object -First 1
            if ($found) { $candidates = @((Split-Path (Split-Path (Split-Path $found.FullName)))) }
          }
          if (-not $candidates) { throw '未找到 ucrt64 GCC（MSYS2 安装位置解析失败）' }
          Write-Host "MSYS2 root: $($candidates[0])"
          "MSYS2_ROOT=$($candidates[0])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Toolchain versions
        shell: pwsh
        run: |
          cmake --version | Select-Object -First 1
          & "$env:MSYS2_ROOT\ucrt64\bin\gcc.exe" --version | Select-Object -First 1
          Test-Path "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"

      - name: Verify reviewed build dependencies
        shell: pwsh
        run: ./scripts/Test-BuildDependencies.ps1 -MsysRoot $env:MSYS2_ROOT

      - name: Offline Windows local adapter resource failure audit
        shell: pwsh
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = 'Stop'
          $temp = Join-Path $env:RUNNER_TEMP ('adapter-audit-' + [Guid]::NewGuid().ToString('N'))
          [void](New-Item -ItemType Directory -Path $temp)
          try {
            $root = '认证核心源码/esurfingclient/app'
            Copy-Item -LiteralPath (Join-Path $root 'include') -Destination $temp -Recurse
            Copy-Item -LiteralPath (Join-Path $root 'third_party/cJSON') -Destination $temp -Recurse
            Copy-Item -LiteralPath (Join-Path $root 'src/utils/platform/NetAdapters.c') -Destination $temp
            Copy-Item -LiteralPath (Join-Path $root 'src/utils/platform/PlatformInternal.h') -Destination $temp
            Copy-Item -LiteralPath 'scripts/tests/adapter_windows_audit.c' -Destination $temp
            Push-Location -LiteralPath $temp
            try {
              $bin = Join-Path $env:MSYS2_ROOT 'ucrt64/bin'
              $env:PATH = "$bin;$env:PATH"
              $gcc = Join-Path $bin 'gcc.exe'
              $PSNativeCommandUseErrorActionPreference = $false
              $output = @(& $gcc -v -std=gnu11 -O1 -Iinclude -I. adapter_windows_audit.c cJSON/cJSON.c -o adapter_audit.exe -liphlpapi -lws2_32 2>&1)
              $code = $LASTEXITCODE
              $output | ForEach-Object { Write-Host "$_" }
              if ($code -ne 0 -or -not (Test-Path -LiteralPath 'adapter_audit.exe' -PathType Leaf)) { throw "Windows adapter audit compile failed: exit=$code" }
              $result = @(& ./adapter_audit.exe 2>&1)
              $code = $LASTEXITCODE
              $result | ForEach-Object { Write-Host "$_" }
              if ($code -ne 0 -or -not ($result -ceq 'WINDOWS_LOCAL_ADAPTER_RESOURCE_PASS cases=22')) { throw "Windows adapter resource audit failed: exit=$code" }
            } finally { Pop-Location }
          } finally { Remove-Item -LiteralPath $temp -Recurse -Force }

      - name: Offline Windows local log archive regression
        shell: pwsh
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = 'Stop'
          $temp = Join-Path $env:RUNNER_TEMP ('log-archive-audit-' + [Guid]::NewGuid().ToString('N'))
          [void](New-Item -ItemType Directory -Path $temp)
          try {
            $root = '认证核心源码/esurfingclient/app/src/utils/log'
            Copy-Item -LiteralPath (Join-Path $root 'LogArchiveFile.h') -Destination $temp
            Copy-Item -LiteralPath (Join-Path $root 'LogPrivateFile.h') -Destination $temp
            Copy-Item -LiteralPath 'scripts/tests/log_archive_audit.c' -Destination $temp
            Push-Location -LiteralPath $temp
            try {
              $bin = Join-Path $env:MSYS2_ROOT 'ucrt64/bin'
              $env:PATH = "$bin;$env:PATH"
              $gcc = Join-Path $bin 'gcc.exe'
              $PSNativeCommandUseErrorActionPreference = $false
              $output = @(& $gcc -std=gnu11 -Wall -Wextra -Werror -O1 -I. log_archive_audit.c -o archive_audit.exe 2>&1)
              $code = $LASTEXITCODE
              $output | ForEach-Object { Write-Host "$_" }
              if ($code -ne 0 -or -not (Test-Path -LiteralPath 'archive_audit.exe' -PathType Leaf)) { throw "Windows archive audit compile failed: exit=$code" }
              $result = @(& ./archive_audit.exe $temp 2>&1)
              $code = $LASTEXITCODE
              $result | ForEach-Object { Write-Host "$_" }
              if ($code -ne 0 -or -not ($result -ccontains 'LOCAL_LOG_ARCHIVE_NO_REPLACE_PASS cases=4') -or -not ($result -ccontains 'LOCAL_LOG_IDENTITY_AND_APPEND_PASS')) { throw "Windows archive audit failed: exit=$code" }
              $fixture = Join-Path $temp 'junction-test'
              $target = Join-Path $fixture 'plain'
              $junction = Join-Path $fixture 'mapped'
              [void](New-Item -ItemType Directory -Path $target)
              [void](New-Item -ItemType Junction -Path $junction -Target $target)
              try {
                $result = @(& ./archive_audit.exe $fixture check-junction 2>&1)
                $code = $LASTEXITCODE
                $result | ForEach-Object { Write-Host "$_" }
                if ($code -ne 0 -or -not ($result -ccontains 'LOCAL_LOG_ANCESTOR_JUNCTION_REJECTED_PASS')) { throw "Windows log path audit failed: exit=$code" }
              } finally { [IO.Directory]::Delete($junction) }
            } finally { Pop-Location }
          } finally { Remove-Item -LiteralPath $temp -Recurse -Force }

      - name: Build core and GUI from source
        shell: pwsh
        run: |
          ./Build-Core.ps1 `
            -CMake (Get-Command cmake.exe).Source `
            -Ninja (Join-Path $env:MSYS2_ROOT 'ucrt64\bin\ninja.exe') `
            -Gcc (Join-Path $env:MSYS2_ROOT 'ucrt64\bin\gcc.exe') `
            -Gxx (Join-Path $env:MSYS2_ROOT 'ucrt64\bin\g++.exe')
      # 说明：Build-Core.ps1 同时产出认证核心与桌面 EXE（核心哈希已写入其生成源码），
      # 二者自洽。不再在 CI 上运行 Build.ps1 —— 仓库提交的 CoreHash 与 CI 现编核心
      # 的哈希逐字节一致在本工具链下不可保证（实测同机重编哈希即变）。

      - name: Offline self-tests
        shell: pwsh
        run: |
          $exe = 'build-core\澈知科技-源码重建.exe'
          # 注意：pwsh 的 & 不等待 GUI 子系统进程（$LASTEXITCODE 不设置），
          # 必须用 Start-Process -Wait 显式等待并取真实退出码
          function Invoke-SelfTest([string]$testArgs) {
            $p = Start-Process -FilePath $exe -ArgumentList $testArgs -Wait -PassThru -NoNewWindow
            if ($p.ExitCode -ne 0) { Write-Host "##[error]自测失败: $testArgs (exit $($p.ExitCode))"; exit 1 }
          }
          Invoke-SelfTest '--self-test-logic'
          Invoke-SelfTest '--self-test-credentials'
          Invoke-SelfTest '--self-test-core'
          Invoke-SelfTest '--self-test-native-input'
          Invoke-SelfTest '--self-test-native-net'
          Invoke-SelfTest '--self-test-stop'   # 离线 probe 钩子：仅验证 STOP 通道与结构化事件，不触碰真实认证
          Invoke-SelfTest '--self-test-resources' # 30 offline core cycles, mandatory exit and pipe drain

      - name: Offline UI self-test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath 'build-core\澈知科技-源码重建.exe' -ArgumentList '--self-test-ui' -Wait -PassThru -NoNewWindow
          Write-Host "UI test exit: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "UI self-test failed: $($p.ExitCode)" }

      - name: Offline application lifecycle (100 cycles, real message loop)
        timeout-minutes: 5
        shell: pwsh
        run: |
          $p = Start-Process -FilePath 'build-core\澈知科技-源码重建.exe' -ArgumentList '--self-test-app-lifecycle' -Wait -PassThru -NoNewWindow
          Write-Host "Application lifecycle test exit: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "Application lifecycle self-test failed: $($p.ExitCode)" }

      - name: Offline UI scroll and resource stress (100 measured cycles)
        timeout-minutes: 5
        shell: pwsh
        run: |
          $p = Start-Process -FilePath 'build-core\澈知科技-源码重建.exe' -ArgumentList '--self-test-ui-stress' -Wait -PassThru -NoNewWindow
          Write-Host "UI stress test exit: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "UI stress self-test failed: $($p.ExitCode)" }

      - name: Authenticode regression (signed and tampered fixture)
        shell: pwsh
        run: |
          $candidates = @(
            (Get-Command pwsh.exe).Source,
            "$env:WINDIR\System32\WindowsPowerShell\v1.0\powershell.exe",
            "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          )
          $fixture = $candidates | Where-Object {
            if ($_ -and (Test-Path -LiteralPath $_)) {
              $sig = Get-AuthenticodeSignature -LiteralPath $_
              $sig.Status -eq 'Valid' -and $sig.SignatureType -eq 'Authenticode'
            }
          } | Select-Object -First 1
          if (-not $fixture) { throw 'No trusted embedded-signature fixture found' }
          $args = '--self-test-signature "' + $fixture + '"'
          $p = Start-Process -FilePath 'build-core\澈知科技-源码重建.exe' -ArgumentList $args -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "Signature regression failed: $($p.ExitCode)" }

      - name: Offline secret scanner regression
        shell: pwsh
        run: ./scripts/scan-secrets.ps1 -SelfTest

      - name: Secret scan
        shell: pwsh
        run: ./scripts/scan-secrets.ps1

      - name: Offline curl advisory range regression
        shell: pwsh
        run: ./scripts/Test-CurlVulns.ps1 -SelfTest

      - name: Dependency vulnerability check (curl; findings require release review)
        shell: pwsh
        run: ./scripts/Test-CurlVulns.ps1

      - name: Verify artifact manifest against checkout and files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = 'build-core'
          $m = Get-Content -LiteralPath (Join-Path $dir 'build-manifest.json') -Raw | ConvertFrom-Json
          $head = @(git rev-parse --verify HEAD)
          if ($LASTEXITCODE -ne 0 -or $head.Count -ne 1 -or $m.schemaVersion -ne 2 -or $m.gitCommit -cne $head[0]) { throw 'Manifest checkout mismatch' }
          $checkout = $m.checkoutEvidence
          if ($checkout.status -cne 'clean-observed' -or
              $checkout.before.state -cne 'clean' -or $checkout.after.state -cne 'clean' -or
              $checkout.before.commit -cne $head[0] -or $checkout.after.commit -cne $head[0]) { throw 'Manifest checkout provenance unverified' }
          Write-Host 'BUILD_CHECKOUT_EVIDENCE_PASS'
          if ($m.dependencies.curl.sha256 -cne 'E3DE77CFA6367083C776A26647FC9F633B538C06C3BAA73D931A252AC8F72B49') { throw 'Manifest dependency lock mismatch' }
          $expected = @('认证核心-源码重建.exe','澈知科技-源码重建.exe','澈知科技-源码重建.exe.config')
          if (@($m.outputs).Count -ne $expected.Count) { throw 'Manifest output count mismatch' }
          foreach ($name in $expected) {
            $entry = @($m.outputs | Where-Object { $_.file -ceq $name })
            if ($entry.Count -ne 1) { throw "Missing or duplicate artifact: $name" }
            $file = Join-Path $dir $name
            if ((Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash -cne $entry[0].sha256 -or
                (Get-Item -LiteralPath $file).Length -ne $entry[0].bytes) { throw "Artifact mismatch: $name" }
          }
          $root = '认证核心源码/esurfingclient/app/third_party/cJSON'
          if ($m.dependencies.cJSON.version -cne '1.7.19' -or @($m.dependencies.cJSON.files).Count -ne 2) { throw 'cJSON manifest mismatch' }
          foreach ($name in @('cJSON.c','cJSON.h')) {
            $entry = @($m.dependencies.cJSON.files | Where-Object { $_.file -ceq $name })
            if ($entry.Count -ne 1 -or (Get-FileHash -LiteralPath (Join-Path $root $name) -Algorithm SHA256).Hash -cne $entry[0].sha256) { throw "Vendored source mismatch: $name" }
          }
          Write-Host 'BUILD_MANIFEST_VERIFY_PASS'

      - name: Inspect Windows PE architecture and import tables
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $objdump = Join-Path $env:MSYS2_ROOT 'ucrt64/bin/objdump.exe'
          $dir = 'build-core'
          # MinGW objdump on this runner cannot open non-ASCII filenames.
          # Inspect a private ASCII-named copy of the exact verified bytes.
          $temp = Join-Path $env:RUNNER_TEMP ('pe-audit-' + [Guid]::NewGuid().ToString('N'))
          if ($temp -match '[^\x20-\x7e]') { throw 'PE audit needs an ASCII temporary path' }
          [void](New-Item -ItemType Directory -Path $temp)
          $report = [ordered]@{ schemaVersion = 1; scope = 'direct PE imports only; not transitive or dynamic loads'; files = @() }
          $lock = Get-Content -LiteralPath 'scripts/build-dependencies.lock.json' -Raw | ConvertFrom-Json
          try {
            foreach ($name in @('认证核心-源码重建.exe','澈知科技-源码重建.exe')) {
              $file = Join-Path $dir $name
              $isCore = $name -ceq '认证核心-源码重建.exe'
              $copy = Join-Path $temp $(if ($isCore) { 'core.exe' } else { 'gui.exe' })
              $digest = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash
              [IO.File]::Copy((Resolve-Path -LiteralPath $file).Path, $copy, $false)
              if ((Get-FileHash -LiteralPath $copy -Algorithm SHA256).Hash -cne $digest) { throw "PE audit copy mismatch: $name" }
              $header = @(& $objdump -f $copy)
              if ($LASTEXITCODE -ne 0) { throw "PE header inspection failed: $name" }
              $imports = @(& $objdump -p $copy)
              if ($LASTEXITCODE -ne 0) { throw "PE import inspection failed: $name" }
              $format = @($header | Select-String 'file format ' | ForEach-Object { ($_.Line -split 'file format ')[-1].Trim() })
              if ($format.Count -ne 1) { throw "Unexpected PE format: $name" }
              if ($isCore -and $format[0] -cne 'pei-x86-64') { throw 'Native core is not x86-64' }
              $dlls = @($imports | ForEach-Object { if ($_ -match 'DLL Name:\s*(\S+)') { $Matches[1].ToLowerInvariant() } } | Sort-Object -Unique)
              if ($dlls.Count -eq 0) { throw "No direct imports found: $name" }
              $expected = @(if ($isCore) { $lock.peDirectImports.core } else { $lock.peDirectImports.gui })
              if ($expected.Count -eq 0 -or ($expected | Sort-Object -Unique).Count -ne $expected.Count) { throw "Invalid reviewed PE baseline: $name" }
              $diff = @(Compare-Object -ReferenceObject $expected -DifferenceObject $dlls -CaseSensitive)
              if ($diff.Count -ne 0) {
                $diff | Format-Table -AutoSize | Out-String | Write-Host
                throw "PE direct import baseline drift: $name"
              }
              if (@($dlls | Where-Object { $_ -match '^(libcurl|libgcc|libstdc\+\+|libwinpthread|cjson|libcjson).*\.dll$' }).Count -gt 0) {
                throw "Unexpected shared dependency: $name"
              }
              if ((Get-FileHash -LiteralPath $copy -Algorithm SHA256).Hash -cne $digest -or
                  (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash -cne $digest) { throw "PE audit bytes changed: $name" }
              $report.files += [ordered]@{file=$name;sha256=$digest;format=$format[0];imports=$dlls}
              Write-Host "$name : $($dlls -join ', ')"
            }
          } finally {
            Remove-Item -LiteralPath $temp -Recurse -Force
          }
          $report | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath (Join-Path $dir 'pe-imports.json') -Encoding utf8
          Write-Host 'PE_DIRECT_IMPORT_AUDIT_PASS'

      - name: Generate source-level CycloneDX SBOM
        shell: pwsh
        run: ./scripts/New-SourceSbom.ps1

      - name: Diagnose existing CSharp compiler deterministic capability
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $compiler = Join-Path $env:WINDIR 'Microsoft.NET/Framework64/v4.0.30319/csc.exe'
          if (-not (Test-Path -LiteralPath $compiler -PathType Leaf)) { throw 'Missing existing CSharp compiler' }
          $temp = Join-Path $env:RUNNER_TEMP ('csc-probe-' + [Guid]::NewGuid().ToString('N'))
          [void](New-Item -ItemType Directory -Path $temp)
          try {
            $source = Join-Path $temp 'Probe.cs'
            [IO.File]::WriteAllText($source, 'public static class Probe { public static int Value() { return 42; } }')
            $digests = @()
            $exits = @()
            $unsupported = 0
            foreach ($dir in @('one','two')) {
              $dest = Join-Path $temp $dir
              [void](New-Item -ItemType Directory -Path $dest)
              $dll = Join-Path $dest 'Probe.dll'
              $output = @(& $compiler '/nologo' '/target:library' '/optimize+' '/deterministic+' "/out:$dll" $source 2>&1)
              $code = $LASTEXITCODE
              $exits += $code
              $output | ForEach-Object { Write-Host "$_" }
              if ($code -eq 0) {
                if (-not (Test-Path -LiteralPath $dll -PathType Leaf)) { throw 'Compiler success without output' }
                $digests += (Get-FileHash -LiteralPath $dll -Algorithm SHA256).Hash
              } elseif ($code -eq 1 -and (($output -join "`n") -match 'CS2007: Unrecognized option: ''/deterministic\+''')) {
                $unsupported++
              } else { throw "Unexpected synthetic compiler failure: exit=$code" }
            }
            $identical = $digests.Count -eq 2 -and $digests[0] -ceq $digests[1]
            Write-Host "CSC_DETERMINISM_PROBE exits=$($exits -join ',') outputs=$($digests.Count) byteIdentical=$identical"
            if ($unsupported -eq 2) {
              Write-Host '::warning::Existing CSharp compiler does not support deterministic compilation; GUI reproducibility remains blocked'
            } elseif ($unsupported -ne 0) { throw 'Inconsistent compiler capability result' }
            # Only the explicitly recognized unsupported-option outcome is diagnostic.
            # Synthetic success does not establish GUI reproducibility.
          } finally {
            Remove-Item -LiteralPath $temp -Recurse -Force
          }
          exit 0

      - name: Measure same-runner rebuild repeatability
        timeout-minutes: 10
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $baseline = 'build-core'
          $repeat = Join-Path $env:RUNNER_TEMP ('rebuild-' + [Guid]::NewGuid().ToString('N'))
          $argsMap = @{
            OutputDirectory = $repeat
            CMake = (Get-Command cmake.exe).Source
            Ninja = (Join-Path $env:MSYS2_ROOT 'ucrt64/bin/ninja.exe')
            Gcc = (Join-Path $env:MSYS2_ROOT 'ucrt64/bin/gcc.exe')
            Gxx = (Join-Path $env:MSYS2_ROOT 'ucrt64/bin/g++.exe')
          }
          try {
            ./Build-Core.ps1 @argsMap
            $first = Get-Content -LiteralPath (Join-Path $baseline 'build-manifest.json') -Raw | ConvertFrom-Json
            $second = Get-Content -LiteralPath (Join-Path $repeat 'build-manifest.json') -Raw | ConvertFrom-Json
            if ($first.gitCommit -cne $second.gitCommit -or $first.gitCommit -cne (git rev-parse HEAD).Trim()) { throw 'Rebuild checkout mismatch' }
            $results = @()
            foreach ($name in @('认证核心-源码重建.exe','澈知科技-源码重建.exe','澈知科技-源码重建.exe.config')) {
              $a = (Get-FileHash -LiteralPath (Join-Path $baseline $name) -Algorithm SHA256).Hash
              $b = (Get-FileHash -LiteralPath (Join-Path $repeat $name) -Algorithm SHA256).Hash
              $am = @($first.outputs | Where-Object { $_.file -ceq $name })
              $bm = @($second.outputs | Where-Object { $_.file -ceq $name })
              if ($am.Count -ne 1 -or $bm.Count -ne 1 -or $a -cne $am[0].sha256 -or $b -cne $bm[0].sha256) { throw "Rebuild manifest mismatch: $name" }
              $entry = [ordered]@{file=$name;firstSha256=$a;secondSha256=$b;byteIdentical=($a -ceq $b)}
              if ($name.EndsWith('.exe',[StringComparison]::OrdinalIgnoreCase)) {
                $pe = ./scripts/Compare-PeBuild.ps1 -First (Join-Path $baseline $name) -Second (Join-Path $repeat $name)
                $entry['peComparison'] = $pe
                $changed = @($pe.changedSections | ForEach-Object { if ($_.first) { $_.first.name } else { $_.second.name } })
                Write-Host "REBUILD_PE $name timestamps=$($pe.firstCoffTimestamp),$($pe.secondCoffTimestamp) changedSections=$($changed -join ',')"
              }
              $results += $entry
              Write-Host "REBUILD_FILE $name first=$a second=$b identical=$($a -ceq $b)"
            }
            $identical = @($results | Where-Object { -not $_.byteIdentical }).Count -eq 0
            [ordered]@{schemaVersion=1;scope='two builds on one runner, distinct temporary directories; not independent reproducibility';gitCommit=$first.gitCommit;allByteIdentical=$identical;outputs=$results} |
              ConvertTo-Json -Depth 12 | Set-Content -LiteralPath (Join-Path $baseline 'repeatability.json') -Encoding utf8
            if ($identical) { Write-Host 'SAME_RUNNER_REBUILD_BYTE_IDENTICAL' }
            else { Write-Host '::warning::Same-runner rebuild differs; release reproducibility remains blocked' }
            Write-Host 'REBUILD_MEASUREMENT_COMPLETE'
          } finally {
            if (Test-Path -LiteralPath $repeat -PathType Container) { Remove-Item -LiteralPath $repeat -Recurse -Force }
          }

      - name: Observe isolated Roslyn compiler and complete existing offline candidate suite
        shell: pwsh
        timeout-minutes: 12
        run: ./scripts/Test-GuiCompilerCandidate.ps1

      - name: Stage reviewed RC documentation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = 'build-core'
          foreach ($name in @('Licenses.txt','THIRD_PARTY_NOTICES.md','RC_PACKAGE.md','RELEASE_CHECKLIST.md')) {
            $src = Join-Path $PWD $name
            $dest = Join-Path $dir $name
            if (-not (Test-Path -LiteralPath $src -PathType Leaf)) { throw "Missing RC document: $name" }
            $item = Get-Item -LiteralPath $src
            if ($item.Length -le 0 -or ($item.Attributes -band [IO.FileAttributes]::ReparsePoint)) { throw "Invalid RC document: $name" }
            if (Test-Path -LiteralPath $dest) { throw "Unexpected existing RC document: $name" }
            Copy-Item -LiteralPath $src -Destination $dest
            if ((Get-FileHash -LiteralPath $src -Algorithm SHA256).Hash -cne (Get-FileHash -LiteralPath $dest -Algorithm SHA256).Hash) { throw "RC document digest mismatch: $name" }
          }
          Write-Host 'RC_DOCUMENTATION_STAGE_PASS files=4'

      - name: Bind unsigned build evidence to artifact digests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = 'build-core'
          Copy-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'build-toolchain-evidence.json') -Destination (Join-Path $dir 'build-toolchain-evidence.json')
          $files = @('认证核心-源码重建.exe','澈知科技-源码重建.exe','澈知科技-源码重建.exe.config','build-manifest.json','sbom.cdx.json','pe-imports.json','repeatability.json','build-toolchain-evidence.json','Licenses.txt','THIRD_PARTY_NOTICES.md','RC_PACKAGE.md','RELEASE_CHECKLIST.md','gui-compiler-candidate.json')
          $entries = @(foreach ($name in $files) {
            $file = Join-Path $dir $name
            [ordered]@{file=$name;sha256=(Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash;bytes=(Get-Item -LiteralPath $file).Length}
          })
          [ordered]@{schemaVersion=1;scope='unsigned CI build evidence, not a cryptographic attestation';repository=$env:GITHUB_REPOSITORY;runId=$env:GITHUB_RUN_ID;runAttempt=$env:GITHUB_RUN_ATTEMPT;checkout=(git rev-parse HEAD).Trim();files=$entries} |
            ConvertTo-Json -Depth 6 | Set-Content -LiteralPath (Join-Path $dir 'build-evidence.json') -Encoding utf8
          Write-Host 'BUILD_EVIDENCE_INDEX_PASS'

      - name: Validate source SBOM against pinned CycloneDX schema
        shell: pwsh
        run: ./scripts/Test-SourceSbomSchema.ps1

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chezhi-windows-build
          path: |
            build-core/澈知科技-源码重建.exe
            build-core/认证核心-源码重建.exe
            build-core/build-manifest.json
            build-core/sbom.cdx.json
            build-core/pe-imports.json
            build-core/repeatability.json
            build-core/build-toolchain-evidence.json
            build-core/build-evidence.json
            build-core/澈知科技-源码重建.exe.config
            build-core/Licenses.txt
            build-core/THIRD_PARTY_NOTICES.md
            build-core/RC_PACKAGE.md
            build-core/RELEASE_CHECKLIST.md
            build-core/gui-compiler-candidate.json
          if-no-files-found: error

      - name: Preserve non-executable audit evidence when a gate fails
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chezhi-failed-build-audit-only
          path: |
            build-core/build-manifest.json
            build-core/sbom.cdx.json
            build-core/pe-imports.json
            build-core/repeatability.json
            build-core/build-evidence.json
            build-core/build-toolchain-evidence.json
          if-no-files-found: ignore

  sbom-synthetic-audit:
    # Independent generator/schema regression only; no build artifact,
    # credentials, release, or change to the mandatory Windows scan.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Checkout provenance observation regression
        shell: pwsh
        run: ./scripts/Test-CheckoutEvidence.ps1
      - name: Read-only PE evidence regression
        shell: pwsh
        run: ./scripts/Test-PeEvidence.ps1
      - name: Validate synthetic source inventory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tmp = Join-Path $env:RUNNER_TEMP ('sbom-fixture-' + [Guid]::NewGuid().ToString('N'))
          [void](New-Item -ItemType Directory -Path $tmp)
          try {
            $fixture = [ordered]@{
              schemaVersion = 2
              gitCommit = ('0' * 40)
              builtAtUtc = '2000-01-01T00:00:00Z'
              appVersion = '0.0.0-fixture'
              toolchain = @{ fixture = 'synthetic-only' }
              dependencies = @{
                curl = @{ version = '0.0.0'; sha256 = ('1' * 64); source = 'https://example.invalid/source-fixture.tar.gz' }
                cJSON = @{ version = '0.0.0'; files = @(
                  @{ file = 'cJSON.c'; sha256 = ('2' * 64) }
                  @{ file = 'cJSON.h'; sha256 = ('3' * 64) }
                ) }
              }
            }
            $fixture | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath (Join-Path $tmp 'build-manifest.json') -Encoding utf8
            Write-Host 'SYNTHETIC_SBOM_ONLY: no production build evidence'
            ./scripts/New-SourceSbom.ps1 -BuildDir $tmp
            ./scripts/Test-SourceSbomSchema.ps1 -SbomPath (Join-Path $tmp 'sbom.cdx.json')
            Write-Host 'SYNTHETIC_SBOM_REGRESSION_PASS'
          } finally {
            Remove-Item -LiteralPath $tmp -Recurse -Force
          }

