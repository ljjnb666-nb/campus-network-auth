  linux-crypto-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Private local log file regression
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          gcc -std=gnu11 -Wall -Wextra -Werror -O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all \
            -I'认证核心源码/esurfingclient/app/src/utils/log' scripts/tests/private_log_stream_audit.c -o "$tmp/log_audit"
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 "$tmp/log_audit" "$tmp"
          gcc -std=gnu11 -Wall -Wextra -Werror -O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all \
            -I'认证核心源码/esurfingclient/app/src/utils/log' scripts/tests/log_archive_audit.c -o "$tmp/archive_audit"
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 "$tmp/archive_audit" "$tmp"
      - name: cJSON source usage and arithmetic regression
        shell: bash
        run: |
          set -euo pipefail
          cd '认证核心源码/esurfingclient/app'
          # Search identifiers, including indirect references. Distinguish
          # no matches from a failed search; do not silently pass errors.
          # cJSON_Compare belongs to the main library; JSON Patch and
          # other utility functions use the cJSONUtils_ namespace.
          pattern='(cJSON_Compare|cJSONUtils_[[:alnum:]_]+)'
          printf '%s\n' cJSON_Compare cJSONUtils_ApplyPatches cJSONUtils_ApplyPatchesCaseSensitive cJSONUtils_GeneratePatches | grep -wE "$pattern" > "$RUNNER_TEMP/cjson-guard-positive.txt"
          test "$(wc -l < "$RUNNER_TEMP/cjson-guard-positive.txt")" -eq 4
          if printf '%s\n' cJSON_Parse cJSON_Delete cJSON_CompareExtra | grep -qwE "$pattern"; then
            echo 'cJSON guard false positive'; exit 1
          else
            status=$?
            test "$status" -eq 1
          fi
          if git grep -n -w -E "$pattern" -- src include; then
            echo 'Previously unreferenced cJSON comparison/patch API is now in use; review required'
            exit 1
          else
            status=$?
            test "$status" -eq 1
          fi
          if grep -q 'cJSON_Utils' CMakeLists.txt; then
            echo 'cJSON utilities build selection requires review'
            exit 1
          else
            status=$?
            test "$status" -eq 1
          fi
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          cat > "$tmp/json_audit.c" <<'EOF'
          #include "cJSON.c"
          #include <assert.h>
          int main(void)
          {
              unsigned char bytes[32] = {0};
              printbuffer p = {0};
              p.buffer = bytes;
              p.length = sizeof(bytes);
              p.noalloc = true;
              p.offset = 1;
              assert(ensure(&p, (size_t)INT_MAX) == NULL);
              assert(ensure(&p, (size_t)-1) == NULL);
              assert(ensure(&p, 1) == bytes + 1);
              p.offset = 0;
              assert(print_string_ptr((const unsigned char*)"a\n\t\\\"b", &p));
              assert(strcmp((const char*)bytes, "\"a\\n\\t\\\\\\\"b\"") == 0);
              cJSON *obj = cJSON_Parse("{\"name\":\"synthetic\",\"items\":[1,2,3]}");
              assert(obj != NULL);
              char *render = cJSON_PrintUnformatted(obj);
              assert(render != NULL);
              cJSON *parsed = cJSON_Parse(render);
              assert(parsed != NULL);
              cJSON_Delete(parsed);
              cJSON_free(render);
              cJSON_Delete(obj);
              puts("CJSON_BOUNDS_REGRESSION_PASS");
              return 0;
          }
          EOF
          gcc -std=c11 -O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all -Ithird_party/cJSON "$tmp/json_audit.c" -lm -o "$tmp/json_audit"
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 "$tmp/json_audit"
          gcc -std=c11 -Wall -Wextra -Werror -O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all \
            -DCJSON_BYTE_LIMIT=384 -DCJSON_NODE_LIMIT=16 -DCJSON_NESTING_LIMIT=8 \
            -Ithird_party/cJSON "$GITHUB_WORKSPACE/scripts/tests/cjson_resource_limits_audit.c" \
            third_party/cJSON/cJSON.c -lm -o "$tmp/json_limits_audit"
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 "$tmp/json_limits_audit"
          echo CJSON_UNUSED_API_SOURCE_GATE_PASS

      - name: Sanitized local adapter list ownership and allocation failures
        shell: bash
        run: |
          set -euo pipefail
          cd '认证核心源码/esurfingclient/app'
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          cat > "$tmp/adapter_audit.c" <<'EOF'
          #include "utils/platform/NetAdapters.c"
          #include <assert.h>
          char g_school_network_symbol[SCHOOL_NETWORK_SYMBOL] = "test";
          static struct ifaddrs entries[ADAPTER_LIST_MAX + 1];
          static struct sockaddr_in address;
          static size_t fake_count, acquisitions, releases;
          static bool fail_enumeration;
          int __wrap_getifaddrs(struct ifaddrs** out)
          {
              *out = NULL;
              if (fail_enumeration) return -1;
              assert(fake_count <= ADAPTER_LIST_MAX + 1);
              memset(entries, 0, sizeof(entries));
              address.sin_family = AF_INET;
              address.sin_addr.s_addr = htonl(0xc0000201u);
              for (size_t i = 0; i < fake_count; ++i) {
                  entries[i].ifa_name = (char*)"synthetic";
                  entries[i].ifa_addr = (struct sockaddr*)&address;
                  entries[i].ifa_next = i + 1 < fake_count ? &entries[i+1] : NULL;
              }
              if (fake_count) *out = entries;
              ++acquisitions;
              return 0;
          }
          void __wrap_freeifaddrs(struct ifaddrs* ptr)
          {
              assert(ptr == NULL || ptr == entries);
              ++releases;
          }
          static size_t realloc_calls, fail_realloc;
          void* __real_realloc(void*, size_t);
          void* __wrap_realloc(void* ptr, size_t size)
          {
              if (++realloc_calls == fail_realloc) return NULL;
              return __real_realloc(ptr, size);
          }
          static size_t calls, fail_at, live;
          static void* test_allocate(size_t size)
          {
              if (++calls == fail_at) return NULL;
              void* p = malloc(size);
              if (p) ++live;
              return p;
          }
          static void test_release(void* p)
          {
              if (p) { assert(live > 0); --live; free(p); }
          }
          static void check_json(size_t count)
          {
              char* json = get_adapters_json();
              assert(json);
              cJSON* root = cJSON_Parse(json);
              cJSON_free(json);
              assert(root);
              const cJSON* rows = cJSON_GetObjectItemCaseSensitive(root, "adapters");
              assert(cJSON_IsArray(rows));
              assert(cJSON_GetArraySize(rows) == (int)count);
              cJSON_Delete(root);
              assert(acquisitions == releases);
          }
          int main(void)
          {
              fake_count = 2;
              check_json(2);
              fail_enumeration = true;
              assert(get_adapters_json() == NULL);
              fail_enumeration = false;
              fake_count = 0;
              check_json(0);
              fake_count = ADAPTER_LIST_MAX;
              realloc_calls = 0;
              check_json(ADAPTER_LIST_MAX);
              const size_t growth = realloc_calls;
              /* Count only collection growth; JSON uses custom hooks below. */
              adapter_list_t list = {0};
              realloc_calls = 0;
              assert(get_adapters(&list));
              const size_t growth_only = realloc_calls;
              assert(growth_only > 0 && growth_only <= growth);
              adapter_list_clear(&list);
              for (size_t i = 1; i <= growth_only; ++i) {
                  realloc_calls = 0;
                  fail_realloc = i;
                  assert(get_adapters_json() == NULL);
                  assert(acquisitions == releases);
              }
              fail_realloc = 0;
              fake_count = ADAPTER_LIST_MAX + 1;
              assert(get_adapters_json() == NULL);
              assert(acquisitions == releases);
              fake_count = 2;
              cJSON_Hooks hooks = {test_allocate, test_release};
              cJSON_InitHooks(&hooks);
              char* json = get_adapters_json();
              assert(json);
              cJSON_free(json);
              assert(live == 0);
              const size_t total = calls;
              assert(total > 0 && total < 1000);
              for (size_t i = 1; i <= total; ++i) {
                  calls = 0;
                  fail_at = i;
                  json = get_adapters_json();
                  assert(json == NULL);
                  assert(live == 0 && acquisitions == releases);
              }
              fail_at = 0;
              check_json(2);
              assert(live == 0);
              cJSON_InitHooks(NULL);
              printf("ADAPTER_RESOURCE_AUDIT_PASS growthFailures=%zu jsonFailures=%zu maxRows=%u\n", growth_only, total, ADAPTER_LIST_MAX);
              return 0;
          }
          EOF
          gcc -std=gnu11 -O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all \
            -Iinclude -Isrc -Ithird_party "$tmp/adapter_audit.c" third_party/cJSON/cJSON.c \
            -Wl,--wrap=getifaddrs,--wrap=freeifaddrs,--wrap=realloc -lm -o "$tmp/adapter_audit"
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 "$tmp/adapter_audit"

      - name: Sanitized traffic snapshot lifecycle and allocator failures
        shell: bash
        run: |
          set -euo pipefail
          cd '认证核心源码/esurfingclient/app'
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          cat > "$tmp/traffic_audit.c" <<'EOF'
          #include "net/NetTraffic.c"
          #include <assert.h>
          /* No actual adapter queries or production logger in this harness. */
          uint8_t get_adapters_stats(adapter_stats_t* out, uint8_t max, char* id, size_t len)
          {
              (void)out; (void)max; (void)id; (void)len;
              abort();
          }
          uint64_t get_steady_tm_ms(void) { abort(); }
          void log_out(log_level_t level, const char* file, uint32_t line, const char* fmt, ...)
          {
              (void)level; (void)file; (void)line; (void)fmt;
          }
          static size_t calls, fail_at, live;
          static void* test_allocate(size_t size)
          {
              if (++calls == fail_at) return NULL;
              void* p = malloc(size);
              if (p) ++live;
              return p;
          }
          static void test_release(void* p)
          {
              if (p) {
                  assert(live > 0);
                  --live;
                  free(p);
              }
          }
          int main(void)
          {
              assert(traffic_resource_self_test());
              /* The isolated self-test workers have been joined. Only
               * this test process changes cJSON's process-global hooks. */
              traffic_snapshot_t sample = {0};
              sample.count = 2;
              sample.timestamp = 1234;
              strcpy(sample.rows[0].id, "test0");
              sample.rows[0].has_rate = true;
              sample.rows[0].down = 12;
              sample.rows[0].up = 34;
              strcpy(sample.rows[1].id, "test1");
              cJSON_Hooks hooks = {test_allocate, test_release};
              cJSON_InitHooks(&hooks);
              char* json = render_snapshot(&sample, 0);
              assert(json != NULL);
              cJSON_free(json);
              assert(live == 0);
              const size_t total = calls;
              assert(total > 0 && total < 1000);
              for (size_t i = 1; i <= total; ++i) {
                  calls = 0;
                  fail_at = i;
                  json = render_snapshot(&sample, 0);
                  assert(json == NULL);
                  assert(live == 0);
                  assert(calls >= i);
              }
              calls = 0;
              fail_at = 0;
              json = render_snapshot(&sample, 0);
              assert(json != NULL);
              cJSON_free(json);
              assert(live == 0);
              cJSON_InitHooks(NULL);
              printf("TRAFFIC_ALLOCATOR_FAILURE_PASS cases=%zu\n", total);
              puts("TRAFFIC_SNAPSHOT_LIFECYCLE_PASS");
              return 0;
          }
          EOF
          gcc -std=gnu11 -O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all \
            -Iinclude -Isrc -Ithird_party "$tmp/traffic_audit.c" \
            src/utils/sim/SimThread.c third_party/cJSON/cJSON.c -pthread -lm -o "$tmp/traffic_audit"
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 "$tmp/traffic_audit"

      - name: Optimized and sanitized offline cipher regression
        shell: bash
        run: |
          set -euo pipefail
          cd '认证核心源码/esurfingclient/app'
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          cat > "$tmp/audit.c" <<'EOF'
          #include "cipher/CipherUtils.h"
          #include "SimEvpInternal.h"
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          extern bool aes_common_known_answer_self_test(void);
          extern bool des_known_answer_self_test(void);
          extern bool sm4_known_answer_self_test(void);
          extern bool des_buffer_lifecycle_self_test(void);
          extern bool remaining_cipher_lifecycle_self_test(void);
          extern bool simssl_cipher_cleanup_self_test(void);
          #ifdef CHECK_FREE
          static void *expected_pointer;
          static size_t expected_length;
          static bool saw_release;
          extern void __real_free(void*);
          void __wrap_free(void *p)
          {
              if (p && p == expected_pointer)
              {
                  const unsigned char *bytes = p;
                  for (size_t i = 0; i < expected_length; ++i)
                      if (bytes[i] != 0) abort();
                  saw_release = true;
                  expected_pointer = NULL;
              }
              __real_free(p);
          }
          #endif
          int main(void)
          {
              const unsigned char md5_expected[16] = {0x90,0x01,0x50,0x98,0x3c,0xd2,0x4f,0xb0,0xd6,0x96,0x3f,0x7d,0x28,0xe1,0x7f,0x72};
              unsigned char digest[16] = {0};
              simssl_md5((const unsigned char*)"abc", 3, digest);
              if (memcmp(digest, md5_expected, sizeof(digest))) return 1;
              simssl_secure_zero(digest, sizeof(digest));
              size_t n = 99;
              unsigned char padded[16];
              memset(padded, 16, sizeof(padded));
              unsigned char *empty = rm_pkcs7_padding(padded, sizeof(padded), &n);
              if (!empty || n != 0) return 2;
              s_secure_free(empty, 1);
              unsigned char *secret = malloc(64);
              if (!secret) return 3;
              memset(secret, 0xa5, 64);
          #ifdef CHECK_FREE
              expected_pointer = secret;
              expected_length = 64;
          #endif
              s_secure_free(secret, 64);
          #ifdef CHECK_FREE
              if (!saw_release) return 4;
          #endif
              if (!aes_common_known_answer_self_test() ||
                  !des_known_answer_self_test() ||
                  !sm4_known_answer_self_test() ||
                  !simssl_cipher_cleanup_self_test() ||
                  !des_buffer_lifecycle_self_test() ||
                  !remaining_cipher_lifecycle_self_test()) return 5;
              puts("CRYPTO_OFFLINE_AUDIT_PASS");
              return 0;
          }
          EOF
          sources=(src/cipher/CipherUtils.c src/cipher/algo/*.c src/utils/sim/SimEvp{Aes,Cipher,Des3,Md5}.c)
          includes=(-Iinclude -Isrc/utils/sim)
          gcc -std=c11 -O2 -DCHECK_FREE "${includes[@]}" "$tmp/audit.c" "${sources[@]}" -Wl,--wrap=free -o "$tmp/optimized"
          "$tmp/optimized"
          gcc -std=c11 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all "${includes[@]}" "$tmp/audit.c" "${sources[@]}" -o "$tmp/sanitized"
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 "$tmp/sanitized"
          # Observe dead-stack-buffer wiping in optimized compiler output.
          # This is a narrow x86-64 GCC codegen gate, not an audit of every call site.
          cat > "$tmp/wipe.c" <<'EOF'
          #include "cipher/CipherUtils.h"
          #include "SimEvpInternal.h"
          __attribute__((noinline,used)) void cipher_wipe_probe(void)
          {
              unsigned char dead[32];
              cipher_secure_zero(dead, sizeof(dead));
          }
          __attribute__((noinline,used)) void evp_wipe_probe(void)
